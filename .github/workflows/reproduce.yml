name: Reproduce Preview real-timer failure

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show runner browser version
        run: google-chrome --version

      # Keep the job red while the locator click fails on Vitest 5.0.0.
      # Do not hide the reproduction failure with continue-on-error.
      - name: Run reproduction
        env:
          BROWSER: google-chrome
          BROWSER_ARGS: --headless --no-sandbox --disable-dev-shm-usage --user-data-dir=${{ runner.temp }}/vitest-preview-chrome
        run: npx vitest run
